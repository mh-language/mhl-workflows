services:
  postgres:
    image: postgres:16-alpine
    container_name: specification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specification}
      POSTGRES_USER: ${POSTGRES_USER:-specification}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specification}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specification} -d ${POSTGRES_DB:-specification}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - specification

  adminer:
    image: adminer:4
    container_name: specification-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - specification

volumes:
  postgres_data:

networks:
  specification:
